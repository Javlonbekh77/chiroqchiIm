<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zamonaviy Ta'lim Muhiti</title>
  <link rel="icon" type="image/png" href="/main-logo1.png" />
  <!-- Use Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <div id="root">
    <style>
      body { margin: 0; padding: 0; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Inter', sans-serif; }
      .initial-loader { display: flex; flex-direction: column; align-items: center; gap: 20px; }
      .spinner { width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top-color: #ff6b00; border-radius: 50%; animation: spin 1s linear infinite; }
      .loading-text { color: #071a33; font-weight: 600; font-size: 18px; letter-spacing: 0.5px; animation: pulse 1.5s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
    <div class="initial-loader">
      <div class="spinner"></div>
      <div class="loading-text">Chiroqchi IM yuklanmoqda...</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
